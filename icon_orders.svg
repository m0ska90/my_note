<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Градиент фона -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Градиент для рамки -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:0.8"/>
    </linearGradient>
    
    <!-- Градиент текста -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a8edea;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Свечение -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" rx="60" ry="60" fill="url(#bg)"/>
  
  <!-- Рамка -->
  <rect x="4" y="4" width="504" height="504" rx="56" ry="56" fill="none" stroke="url(#border)" stroke-width="4"/>
  
  <!-- Декоративные элементы - линии сетки (как на чертеже) -->
  <g opacity="0.1">
    <line x1="50" y1="100" x2="462" y2="100" stroke="#00d2ff" stroke-width="1"/>
    <line x1="50" y1="150" x2="462" y2="150" stroke="#00d2ff" stroke-width="1"/>
    <line x1="50" y1="200" x2="462" y2="200" stroke="#00d2ff" stroke-width="1"/>
    <line x1="50" y1="250" x2="462" y2="250" stroke="#00d2ff" stroke-width="1"/>
    <line x1="50" y1="300" x2="462" y2="300" stroke="#00d2ff" stroke-width="1"/>
    <line x1="50" y1="350" x2="462" y2="350" stroke="#00d2ff" stroke-width="1"/>
    <line x1="50" y1="400" x2="462" y2="400" stroke="#00d2ff" stroke-width="1"/>
    <line x1="100" y1="50" x2="100" y2="462" stroke="#00d2ff" stroke-width="1"/>
    <line x1="150" y1="50" x2="150" y2="462" stroke="#00d2ff" stroke-width="1"/>
    <line x1="200" y1="50" x2="200" y2="462" stroke="#00d2ff" stroke-width="1"/>
    <line x1="250" y1="50" x2="250" y2="462" stroke="#00d2ff" stroke-width="1"/>
    <line x1="300" y1="50" x2="300" y2="462" stroke="#00d2ff" stroke-width="1"/>
    <line x1="350" y1="50" x2="350" y2="462" stroke="#00d2ff" stroke-width="1"/>
    <line x1="400" y1="50" x2="400" y2="462" stroke="#00d2ff" stroke-width="1"/>
  </g>
  
  <!-- Стилизованный 3D-принтер -->
  <g transform="translate(256, 230)" filter="url(#shadow)">
    <!-- Основание принтера -->
    <rect x="-140" y="60" width="280" height="30" rx="8" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
    
    <!-- Корпус -->
    <rect x="-120" y="-60" width="240" height="120" rx="12" fill="#1a202c" stroke="#4a5568" stroke-width="2"/>
    
    <!-- Окно печати -->
    <rect x="-100" y="-45" width="200" height="90" rx="8" fill="#0d1117" stroke="#2d3748" stroke-width="2"/>
    
    <!-- Светодиод внутри -->
    <rect x="-95" y="-40" width="190" height="80" rx="6" fill="url(#bg)" opacity="0.8"/>
    
    <!-- Печатаемый объект (звезда/дракончик) -->
    <path d="M 0 -10 L 12 15 L -12 15 Z" fill="#00d2ff" opacity="0.9" filter="url(#glow)"/>
    <path d="M 0 -10 L 12 15 L -12 15 Z" fill="#ffffff" opacity="0.5"/>
    
    <!-- Печатающая голова -->
    <rect x="-15" y="-55" width="30" height="12" rx="3" fill="#e53e3e" opacity="0.8"/>
    <line x1="0" y1="-43" x2="0" y2="-10" stroke="#e53e3e" stroke-width="3" opacity="0.9"/>
    
    <!-- Рамки корпуса -->
    <rect x="-130" y="-70" width="260" height="15" rx="6" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
    <rect x="-130" y="45" width="260" height="15" rx="6" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
    
    <!-- Ножки -->
    <rect x="-110" y="88" width="30" height="12" rx="4" fill="#2d3748"/>
    <rect x="80" y="88" width="30" height="12" rx="4" fill="#2d3748"/>
    
    <!-- LED индикаторы -->
    <circle cx="-110" cy="52" r="4" fill="#48bb78"/>
    <circle cx="-95" cy="52" r="4" fill="#48bb78"/>
    <circle cx="-80" cy="52" r="4" fill="#ecc94b"/>
  </g>
  
  <!-- Текст "Заказики" -->
  <text x="256" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#textGrad)" filter="url(#shadow)">
    Заказики
  </text>
  
  <!-- Текст "и MAX" -->
  <text x="256" y="445" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="bold" fill="#00d2ff" filter="url(#glow)">
    и MAX
  </text>
  
  <!-- Декоративные точки -->
  <circle cx="120" cy="370" r="3" fill="#00d2ff" opacity="0.6"/>
  <circle cx="392" cy="370" r="3" fill="#00d2ff" opacity="0.6"/>
  <circle cx="120" cy="430" r="3" fill="#00d2ff" opacity="0.6"/>
  <circle cx="392" cy="430" r="3" fill="#00d2ff" opacity="0.6"/>
</svg>
